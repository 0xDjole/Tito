[package]
name = "tito"
version = "0.14.1"
edition = "2021"
description = "Database layer on TiKV with indexing, relationships, transactions, and a built-in partitioned scheduled queue"
license = "Apache-2.0"
authors = ["0xDjole 0xdjole@gmail.com"]

repository = "https://github.com/0xDjole/Tito"
homepage = "https://github.com/0xDjole/Tito"
documentation = "https://github.com/0xDjole/Tito"

keywords = ["database", "tikv", "nosql", "indexing"]
categories = ["database", "database-implementations"]

[dependencies]
tokio = { version = "1.6", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["rc", "derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tikv-client = { version = "0.4.0", default-features = false }
uuid = { version = "1.3.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
thiserror = "1.0"
log = "0.4"
rand = "0.8"
base64 = "0.22.0"
async-trait = "0.1"
